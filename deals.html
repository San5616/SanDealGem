<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SanDeal — Exclusive Live Deals</title>
  <link rel="manifest" href="manifest.json" />
  <script src="_config.js"></script>
  <style>
    .navbar {
      position: sticky; top: 0; z-index: 150;
      background: var(--bg-glass); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 7px 10px; display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .brand { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--text-primary); font-weight: 800; font-size: 0.92rem; }
    .brand-badge {
      width: 26px; height: 26px; border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), #9f6e3d); color: #0b1120;
      display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.74rem;
    }
    .nav-pill {
      padding: 5px 9px; border-radius: 7px; border: 1px solid var(--border-color);
      background: var(--bg-secondary); color: var(--text-primary);
      font-size: 0.7rem; font-weight: 700; text-decoration: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .nav-pill.primary { background: var(--accent); color: #0b1120; border-color: transparent; font-weight: 800; }

    .container { max-width: 1150px; margin: 0 auto; padding: 10px 10px 60px; }

    .filter-bar {
      background: var(--bg-secondary); border: 1px solid var(--border-color);
      border-radius: 11px; padding: 8px 10px; margin-bottom: 10px;
    }
    .plat-pills { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .plat-pills::-webkit-scrollbar { display: none; }
    .p-pill {
      padding: 4px 10px; border-radius: 999px; font-size: 0.68rem; font-weight: 700;
      background: var(--bg-primary); border: 1px solid var(--border-color);
      color: var(--text-secondary); cursor: pointer; white-space: nowrap;
    }
    .p-pill.active { background: var(--accent); color: #0b1120; border-color: var(--accent); }

    .deals-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 9px;
    }
    .deal-card {
      background: var(--bg-secondary); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; gap: 7px;
    }
    .deal-thumb {
      width: 68px; height: 68px; border-radius: 8px; background: #fff;
      border: 1px solid var(--border-color); display: flex; align-items: center;
      justify-content: center; overflow: hidden; flex-shrink: 0; cursor: pointer;
    }
    .deal-thumb img { width: 100%; height: 100%; object-fit: contain; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.78); backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center; z-index: 500; padding: 12px;
    }
    .modal-backdrop.open { display: flex; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">
      <div class="brand-badge">SD</div>
      <span>SanDeal</span>
    </a>
    <div style="display:flex;gap:5px;align-items:center;">
      <button type="button" class="nav-pill" onclick="toggleSanDealPushAlerts(this)">🔔 Alerts</button>
      <a href="index.html" class="nav-pill">🏠 Home</a>
      <a href="track.html" class="nav-pill">🔍 Track</a>
      <button type="button" class="nav-pill" onclick="SD.toggleTheme()">🌓</button>
      <a href="login.html" class="nav-pill primary" id="dealsTopDashBtn">🔐 Login</a>
    </div>
  </nav>

  <main class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
      <div>
        <h1 style="font-size:1.05rem;font-weight:800;">🔥 Exclusive Live Deals</h1>
        <p style="font-size:0.7rem;color:var(--text-secondary);">Tap any photo to open Swipe Gallery & Request Deal</p>
      </div>
      <button type="button" class="nav-pill primary" onclick="if(filteredDeals.length)openDealGallery(0)">
        🖼️ Swipe Gallery Mode
      </button>
    </div>

    <div class="filter-bar">
      <div class="plat-pills" id="platPillsWrap">
        <button class="p-pill active" onclick="setPlatFilter('ALL', this)">All Platforms</button>
        <button class="p-pill" onclick="setPlatFilter('Amazon', this)">Amazon</button>
        <button class="p-pill" onclick="setPlatFilter('Flipkart', this)">Flipkart</button>
        <button class="p-pill" onclick="setPlatFilter('Blinkit', this)">Blinkit</button>
        <button class="p-pill" onclick="setPlatFilter('Myntra', this)">Myntra</button>
        <button class="p-pill" onclick="setPlatFilter('Meesho', this)">Meesho</button>
      </div>
      <input type="text" id="dealSearchInput" oninput="renderDealsList()" placeholder="🔍 Search deal title or platform..." style="width:100%;padding:6px 9px;border-radius:7px;border:1px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);font-size:0.74rem;outline:none;" />
    </div>

    <div class="deals-grid" id="dealsGridContainer">
      <div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--text-secondary);">Loading live deals...</div>
    </div>
  </main>

  <!-- Full-Screen Swipe Gallery & Request Modal -->
  <div class="modal-backdrop" id="dealGalleryModal" onclick="if(event.target===this)this.classList.remove('open')">
    <div style="width:94vw;max-width:450px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:16px;padding:12px;text-align:center;" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span class="mono" style="font-size:0.7rem;color:var(--accent);font-weight:800;" id="dgCounter">Deal</span>
        <div style="display:flex;gap:5px;">
          <button type="button" class="nav-pill" onclick="dgAdjustZoom(0.4)">🔍+</button>
          <button type="button" class="nav-pill" onclick="dgAdjustZoom(-0.4)">🔍-</button>
          <button type="button" class="nav-pill" style="color:#ef4444;" onclick="document.getElementById('dealGalleryModal').classList.remove('open')">✕ Close</button>
        </div>
      </div>

      <div style="width:100%;height:56vh;background:#fff;border-radius:10px;overflow:auto;display:flex;align-items:center;justify-content:center;" ontouchstart="dgTouchStart(event)" ontouchend="dgTouchEnd(event)">
        <img id="dgImg" src="" alt="" ondblclick="dgToggleZoom()" style="max-width:100%;max-height:100%;object-fit:contain;transition:transform 0.2s;" />
      </div>

      <div style="margin-top:8px;font-weight:800;font-size:0.84rem;" id="dgTitle">Deal</div>
      <div class="mono" style="font-size:0.72rem;color:#22c55e;margin-top:2px;" id="dgPriceInfo"></div>

      <div style="display:flex;gap:6px;margin-top:10px;align-items:center;">
        <button type="button" class="nav-pill" onclick="dgStep(-1)">◀ Prev</button>
        <button type="button" id="dgReqBtn" class="nav-pill primary" style="flex:1;justify-content:center;padding:8px;" onclick="requestCurrentGalleryDeal()">
          ⚡ Request Deal
        </button>
        <button type="button" class="nav-pill" style="color:#22c55e;border-color:rgba(34,197,94,0.4);" onclick="askCurrentDealOnWa()">🟢 WA</button>
        <button type="button" class="nav-pill" onclick="dgStep(1)">Next ▶</button>
      </div>
    </div>
  </div>

  <script>
    let allDeals = [];
    let filteredDeals = [];
    let activePlat = 'ALL';
    let dgIdx = 0;
    let dgScale = 1;
    let dgStartX = 0;

    // Fast Thumbnail Resolver (w=400 for fast card grid, w=900 for zoom gallery)
    function resolveThumb(url, size = 'w400') {
      if (!url) return '';
      const s = String(url).trim();
      const m1 = s.match(/[?&]id=([a-zA-Z0-9_-]{15,})/);
      const m2 = s.match(/\/file\/d\/([a-zA-Z0-9_-]{15,})/);
      const id = (m1 && m1[1]) || (m2 && m2[1]);
      return id ? `https://drive.google.com/thumbnail?id=${id}&sz=${size}` : s;
    }

    function setPlatFilter(plat, btn) {
      activePlat = plat;
      document.querySelectorAll('.p-pill').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderDealsList();
    }

    function renderDealsList() {
      const q = document.getElementById('dealSearchInput').value.trim().toLowerCase();
      filteredDeals = allDeals.filter(d => {
        if (activePlat !== 'ALL' && String(d.platform || '').toLowerCase() !== activePlat.toLowerCase()) return false;
        if (q && !`${d.title} ${d.platform} ${d.instructions}`.toLowerCase().includes(q)) return false;
        return true;
      });

      const wrap = document.getElementById('dealsGridContainer');
      if (!filteredDeals.length) {
        wrap.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--text-secondary);">No matching deals found.</div>`;
        return;
      }

      wrap.innerHTML = filteredDeals.map((d, idx) => {
        const isClosed = String(d.status || 'active').toLowerCase() !== 'active';
        const thumb = resolveThumb(d.imageUrl, 'w400');
        const safeTitle = SD.escapeHtml(d.title.replace(/'/g, "\\'"));
        const cleanInst = (d.instructions || '').replace(/\s*\[(Valid Till|Slots):[^\]]+\]/ig, '').trim();

        return `
          <div class="deal-card" style="opacity:${isClosed ? '0.68' : '1'};border-color:${isClosed ? 'rgba(239,68,68,0.45)' : 'var(--border-color)'};">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <span style="font-size:0.62rem;font-weight:800;color:var(--accent);background:var(--accent-glow);padding:2px 7px;border-radius:5px;text-transform:uppercase;">
                  ${SD.escapeHtml(d.platform)}
                </span>
                ${isClosed
                  ? `<span class="mono" style="font-size:0.6rem;background:rgba(239,68,68,0.2);color:#ef4444;padding:2px 6px;border-radius:5px;font-weight:900;">🔴 DEAL OVER</span>`
                  : `<span class="mono" style="font-size:0.6rem;color:#22c55e;font-weight:800;">🟢 LIVE</span>`}
              </div>

              <div style="display:flex;gap:10px;align-items:center;">
                <div class="deal-thumb" onclick="openDealGallery(${idx})" title="Tap to zoom & swipe">
                  ${thumb ? `<img src="${SD.escapeHtml(thumb)}" alt="" loading="lazy" />` : `<span style="font-size:1.4rem;">🛍️</span>`}
                </div>
                <div style="min-width:0;flex:1;">
                  <div style="font-weight:800;font-size:0.8rem;line-height:1.25;margin-bottom:3px;">${SD.escapeHtml(d.title)}</div>
                  ${cleanInst ? `<div style="font-size:0.67rem;color:var(--text-secondary);">${SD.escapeHtml(cleanInst)}</div>` : ''}
                </div>
              </div>
            </div>

            <div>
              ${Number(d.price) > 0 ? `
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg-primary);padding:5px;border-radius:7px;margin-bottom:6px;text-align:center;font-size:0.7rem;">
                  <div><small style="font-size:0.54rem;color:var(--text-muted);display:block;">Price</small><strong class="mono">${SD.formatCurrency(d.price)}</strong></div>
                  <div><small style="font-size:0.54rem;color:var(--text-muted);display:block;">Less</small><strong class="mono" style="color:#dc2626;">-${SD.formatCurrency(d.lessAmount)}</strong></div>
                  <div><small style="font-size:0.54rem;color:var(--text-muted);display:block;">You Get</small><strong class="mono" style="color:#16a34a;">${SD.formatCurrency(d.youGet)}</strong></div>
                </div>
              ` : ''}
              <div style="display:flex;gap:5px;">
                ${!isClosed && d.productUrl ? `<a href="${SD.escapeHtml(d.productUrl)}" target="_blank" class="nav-pill" style="color:var(--cyan);">🔗 Link</a>` : ''}
                <button type="button" ${isClosed ? 'disabled' : ''} class="nav-pill primary" style="flex:1;justify-content:center;padding:7px;" onclick="requestDealDirect('${SD.escapeHtml(d.dealId)}','${safeTitle}',this)">
                  ${isClosed ? '🔴 Closed' : '⚡ Request Deal'}
                </button>
                <button type="button" class="nav-pill" style="color:#22c55e;" onclick="askDealWaByIdx(${idx})">🟢 WA</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openDealGallery(idx) {
      if (!filteredDeals.length) return;
      dgIdx = (idx + filteredDeals.length) % filteredDeals.length;
      dgScale = 1;
      const d = filteredDeals[dgIdx];
      const isClosed = String(d.status || 'active').toLowerCase() !== 'active';
      const img = document.getElementById('dgImg');
      img.style.transform = 'scale(1)';
      img.src = resolveThumb(d.imageUrl, 'w1000');
      document.getElementById('dgTitle').textContent = d.title;
      document.getElementById('dgCounter').textContent = `Deal ${dgIdx + 1} of ${filteredDeals.length} (${d.platform})`;
      document.getElementById('dgPriceInfo').textContent = Number(d.price) > 0
        ? `Price: ₹${d.price} | Less: -₹${d.lessAmount} | You Get: ₹${d.youGet}`
        : (isClosed ? '🔴 DEAL OVER / CLOSED' : '📸 Tap Request Deal or WA to get link');
      const rBtn = document.getElementById('dgReqBtn');
      rBtn.disabled = isClosed;
      rBtn.textContent = isClosed ? '🔴 Closed' : '⚡ Request Deal';
      document.getElementById('dealGalleryModal').classList.add('open');
    }

    function dgStep(dir) { openDealGallery(dgIdx + dir); }
    function dgAdjustZoom(d) { dgScale = Math.min(3, Math.max(1, dgScale + d)); document.getElementById('dgImg').style.transform = `scale(${dgScale})`; }
    function dgToggleZoom() { dgScale = dgScale > 1 ? 1 : 2.2; document.getElementById('dgImg').style.transform = `scale(${dgScale})`; }
    function dgTouchStart(e) { if (e.touches?.length === 1) dgStartX = e.touches[0].clientX; }
    function dgTouchEnd(e) {
      if (dgScale > 1) return;
      const dx = (e.changedTouches?.[0]?.clientX || dgStartX) - dgStartX;
      if (Math.abs(dx) > 50) dgStep(dx < 0 ? 1 : -1);
    }

    async function requestDealDirect(dealId, title, btn) {
      if (!SD.getUser()) {
        askDealWaText(`👋 *Hi SanDeal Admin, I want this Deal:*\n🛍️ *Deal:* ${title}\n🆔 *ID:* ${dealId}`);
        return;
      }
      btn.disabled = true; btn.textContent = '...';
      const res = await SD.api('requestDeal', { dealId, dealTitle: title });
      if (res?.success) { btn.textContent = '✓ Requested'; SD.toast(res.message, 'success'); }
      else { btn.disabled = false; btn.textContent = '⚡ Request Deal'; SD.toast(res?.error || 'Error', 'error'); }
    }

    function requestCurrentGalleryDeal() {
      const d = filteredDeals[dgIdx];
      if (d) requestDealDirect(d.dealId, d.title, document.getElementById('dgReqBtn'));
    }

    function askDealWaByIdx(idx) {
      const d = filteredDeals[idx];
      if (!d) return;
      askDealWaText(`👋 *Hi SanDeal Admin, Deal Inquiry:*\n🛍️ *Product:* ${d.title}\n🌐 *Platform:* ${d.platform}\n🆔 *Deal ID:* ${d.dealId}\nPlease share the deal link.`);
    }

    function askCurrentDealOnWa() { askDealWaByIdx(dgIdx); }

    function askDealWaText(msg) {
      window.open(`https://wa.me/917004984949?text=${encodeURIComponent(msg)}`, '_blank');
    }

    async function initDealsPage() {
      const u = SD.getUser();
      if (u) {
        const b = document.getElementById('dealsTopDashBtn');
        b.textContent = `⚡ ${u.name.split(' ')[0]}'s Panel`;
        b.href = u.role === 'admin' ? 'admin-dashboard.html' : (u.role === 'mediator' ? 'mediator-dashboard.html' : 'buyer-dashboard.html');
      }
      const res = await SD.api('getDeals');
      if (res?.success) {
        allDeals = res.deals || [];
        renderDealsList();
      }
    }
    initDealsPage();
  </script>
</body>
</html>
