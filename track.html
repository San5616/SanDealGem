<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SanDeal — Public Order Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <script src="_config.js"></script>
  <style>
    .navbar {
      position: sticky; top: 0; z-index: 150;
      background: var(--bg-glass); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 7px 10px; display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .brand { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--text-primary); font-weight: 800; font-size: 0.92rem; }
    .brand-badge {
      width: 26px; height: 26px; border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), #9f6e3d); color: #0b1120;
      display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.74rem;
    }
    .nav-pill {
      padding: 5px 9px; border-radius: 7px; border: 1px solid var(--border-color);
      background: var(--bg-secondary); color: var(--text-primary);
      font-size: 0.7rem; font-weight: 700; text-decoration: none; cursor: pointer;
    }
    .nav-pill.primary { background: var(--accent); color: #0b1120; border-color: transparent; font-weight: 800; }

    .container { max-width: 560px; margin: 0 auto; padding: 10px 10px 50px; }

    .search-box {
      background: var(--bg-secondary); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 11px; margin-bottom: 10px;
    }
    .track-row { display: flex; gap: 6px; margin-top: 6px; }
    .track-inp {
      flex: 1; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--border-color);
      background: var(--bg-primary); color: var(--text-primary); font-size: 0.76rem; outline: none;
    }
    .track-btn {
      padding: 7px 14px; border-radius: 7px; border: none;
      background: var(--accent); color: #0b1120; font-weight: 800; font-size: 0.75rem; cursor: pointer;
    }

    .result-card {
      background: var(--bg-secondary); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 11px 12px; margin-bottom: 10px;
    }
    .step-grid-6 {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 8px 0;
    }
    .step-chip {
      padding: 5px 6px; border-radius: 7px; background: var(--bg-primary);
      border: 1px solid var(--border-color); text-align: center;
    }
    .step-chip.done { border-color: rgba(34, 197, 94, 0.55); background: rgba(34, 197, 94, 0.08); }
    .info-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;
      background: var(--bg-primary); border: 1px solid var(--border-color);
      border-radius: 9px; padding: 7px; text-align: center; font-size: 0.72rem;
    }
    .info-grid small { font-size: 0.54rem; color: var(--text-muted); text-transform: uppercase; display: block; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">
      <div class="brand-badge">SD</div>
      <span>SanDeal</span>
    </a>
    <div style="display:flex;gap:5px;align-items:center;">
      <a href="index.html" class="nav-pill">🏠 Home</a>
      <a href="deals.html" class="nav-pill">🔥 Deals</a>
      <button type="button" class="nav-pill" onclick="SD.toggleTheme()">🌓</button>
      <a href="login.html" class="nav-pill primary" id="trackTopLoginBtn">🔐 Login</a>
    </div>
  </nav>

  <main class="container">
    <div class="search-box">
      <div style="font-weight:800;font-size:0.86rem;">📦 Public Order Tracking</div>
      <div style="font-size:0.68rem;color:var(--text-secondary);">Enter Amazon, Flipkart, Blinkit or Myntra Platform Order ID</div>
      <form class="track-row" onsubmit="handlePublicTrack(event)">
        <input type="text" id="pubOrderIdInput" class="track-inp mono" placeholder="e.g. 404-2759471-7602761" required />
        <button type="submit" class="track-btn">Track</button>
      </form>
    </div>

    <div id="trackResultsArea"></div>
  </main>

  <script>
    async function handlePublicTrack(e) {
      if (e) e.preventDefault();
      const q = document.getElementById('pubOrderIdInput').value.trim();
      if (!q) return;
      const area = document.getElementById('trackResultsArea');
      area.innerHTML = `<div class="result-card" style="text-align:center;font-size:0.76rem;color:var(--text-secondary);">⏳ Searching SanDeal records for <strong>${SD.escapeHtml(q)}</strong>...</div>`;

      const res = await SD.api('trackOrder', { orderId: q });
      if (!res?.success || !res.results?.length) {
        area.innerHTML = `<div class="result-card" style="text-align:center;font-size:0.76rem;color:#ef4444;">❌ No order found matching "${SD.escapeHtml(q)}".</div>`;
        return;
      }

      area.innerHTML = res.results.map(o => {
        const isPaid = String(o.paymentStatus || '').toLowerCase() === 'paid';
        return `
          <div class="result-card">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px;">
              <div>
                <span class="mono" style="font-weight:800;color:var(--accent);font-size:0.82rem;">Order #${o.orderNo}</span>
                <span class="mono" style="font-size:0.68rem;color:var(--text-secondary);margin-left:5px;">${SD.escapeHtml(o.platformOrderId)}</span>
              </div>
              <div style="display:flex;gap:4px;align-items:center;">
                ${o.daysSinceRefundForm !== null ? `<span class="mono" style="font-size:0.6rem;padding:2px 6px;border-radius:999px;background:rgba(168,85,247,0.16);color:#c084fc;font-weight:700;">⏱️ Form: ${o.daysSinceRefundForm}d ago</span>` : ''}
                ${SD.statusBadge(o.orderStatus)}
              </div>
            </div>

            <div style="font-weight:700;font-size:0.78rem;line-height:1.25;margin-bottom:6px;">${SD.escapeHtml(o.productName)}</div>

            <!-- Compact 3x2 6-Step Grid -->
            <div class="step-grid-6">
              ${(o.steps || []).map(s => `
                <div class="step-chip ${s.done ? 'done' : ''}">
                  <div style="font-size:0.63rem;font-weight:800;color:${s.done ? '#22c55e' : 'var(--text-muted)'};">${s.done ? '✅' : '⏳'} ${SD.escapeHtml(s.name)}</div>
                  <div class="mono" style="font-size:0.58rem;color:var(--text-secondary);margin-top:1px;">${s.date ? SD.formatDate(s.date) : 'Pending'}</div>
                </div>
              `).join('')}
            </div>

            <!-- All Financial & Account Details in 1 Compact 3x2 Box -->
            <div class="info-grid">
              <div><small>Platform</small><strong style="color:var(--accent);">${SD.escapeHtml(o.orderedPlatform)}</strong></div>
              <div><small>Reviewer</small><strong style="color:var(--cyan);">${SD.escapeHtml(o.accountName)}</strong></div>
              <div><small>Order Date</small><strong class="mono">${SD.formatDate(o.orderDate)}</strong></div>
              <div style="border-top:1px solid var(--border-color);padding-top:4px;"><small>Price Paid</small><strong class="mono">${SD.formatCurrency(o.pricePaid)}</strong></div>
              <div style="border-top:1px solid var(--border-color);padding-top:4px;"><small>Buyer Less</small><strong class="mono" style="color:#dc2626;">-${SD.formatCurrency(o.buyerLess)}</strong></div>
              <div style="border-top:1px solid var(--border-color);padding-top:4px;"><small>Refund ToGet</small><strong class="mono" style="color:#22c55e;">${SD.formatCurrency(o.buyerToGet)}</strong></div>
            </div>

            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:7px;padding-top:6px;border-top:1px dashed var(--border-color);font-size:0.71rem;">
              <div>
                <span style="color:var(--text-secondary);font-size:0.65rem;">Payout:</span>
                ${SD.paymentBadge(o.paymentStatus)}
                ${isPaid && o.paymentDate ? `<span class="mono" style="font-size:0.62rem;color:#22c55e;margin-left:4px;">(${SD.formatDate(o.paymentDate)})</span>` : ''}
              </div>
              <strong class="mono" style="color:${isPaid ? '#22c55e' : 'var(--text-muted)'};">
                Settled: ${o.buyerActualGot !== null ? SD.formatCurrency(o.buyerActualGot) : '—'}
              </strong>
            </div>
          </div>
        `;
      }).join('');
    }

    (function initTrackPage() {
      const u = SD.getUser();
      if (u) {
        const b = document.getElementById('trackTopLoginBtn');
        b.textContent = `⚡ ${u.name.split(' ')[0]}'s Panel`;
        b.href = u.role === 'admin' ? 'admin-dashboard.html' : (u.role === 'mediator' ? 'mediator-dashboard.html' : 'buyer-dashboard.html');
      }
      const params = new URLSearchParams(window.location.search);
      const oid = params.get('orderId');
      if (oid) {
        document.getElementById('pubOrderIdInput').value = oid;
        handlePublicTrack();
      }
    })();
  </script>
</body>
</html>
